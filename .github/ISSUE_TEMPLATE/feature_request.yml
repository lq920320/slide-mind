name: 功能建议 / Feature Request
description: 提出新功能或改进建议
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题 / Problem
      placeholder: 例如：演示时无法在第二块屏幕显示演讲者视图……
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 期望的方案 / Proposed solution
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案 / Alternatives considered
